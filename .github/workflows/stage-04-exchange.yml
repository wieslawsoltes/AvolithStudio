name: Land native object exchange
on:
  push:
    branches: [feature/exact-modeling-engineering]
    paths: ['.github/workflows/stage-04-exchange.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exact-modeling-engineering
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integrity-checked source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in fad5d5856c2c9ff2b87700289ae8e170f43ceee6 f269948f9bb4843266b675c1b2603824ff637f2e b01c3510273369e98da7804d7282a30d19f078e9; do
            gh api repos/${{ github.repository }}/git/blobs/$sha --jq .content | base64 -d >> /tmp/stage.br
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';import zlib from 'node:zlib';import crypto from 'node:crypto';import{execFileSync}from'node:child_process';
          const bytes=fs.readFileSync('/tmp/stage.br');if(crypto.createHash('sha256').update(bytes).digest('hex')!=='378151ea3c015084462c6dfa375dc2928b84c16c035ff824c8385039284ac2f8')throw Error('Source checksum mismatch');
          const data=JSON.parse(zlib.brotliDecompressSync(bytes));fs.writeFileSync('/tmp/stage.patch',data.patch);execFileSync('git',['apply','--check','/tmp/stage.patch']);execFileSync('git',['apply','/tmp/stage.patch']);
          for(const[name,content]of Object.entries(data.files)){if(!/^(src|tests|scripts|docs|licenses)\//.test(name)||name.split('/').includes('..'))throw Error('Invalid path');fs.mkdirSync(name.slice(0,name.lastIndexOf('/')),{recursive:true});fs.writeFileSync(name,content);}
          JS
      - uses: actions/cache@v4
        with:
          path: .cache/cad
          key: cad-kernels-1.1.0-1.1.1-rhino8.32.1-v1
      - run: npm run vendor
      - run: npm test && npm run test:exact && npm run test:3dm && npm run build:site
      - name: Commit validated native exchange
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts licenses index.html package.json dist/Avolith-Studio.html
          git commit -m 'feat: strict native 3dm exchange, trimmed B-rep reconstruction and representation-aware browser workflow'
          git push origin HEAD:feature/exact-modeling-engineering
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0 Pillow==12.1.0
      - run: python -m playwright install --with-deps chromium
      - name: Check advanced and exchange browser paths
        run: |
          mkdir -p test-results
          python -m http.server 8765 > test-results/http.log 2>&1 &
          export AVOLITH_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          xvfb-run -a python tests/advanced_browser.py
          xvfb-run -a python tests/interop_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-exchange-browser-evidence
          path: test-results/
          retention-days: 7
