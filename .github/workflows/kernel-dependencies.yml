name: Prepare and verify exact-kernel dependencies
on:
  push:
    paths:
      - '.github/workflows/kernel-dependencies.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pinned open-source CAD libraries
        run: |
          mkdir -p dependency-artifacts
          cd dependency-artifacts
          npm pack replicad@1.1.0
          npm pack replicad-opencascadejs@1.1.0
          npm pack opencascade.js@1.1.1
          npm view replicad@1.1.0 dist --json > replicad-integrity.json
          npm view replicad-opencascadejs@1.1.0 dist --json > opencascade-integrity.json
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-cad-kernel-dependencies
          path: dependency-artifacts/
          retention-days: 7
